services:
  - type: web
    name: insightedu-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: INSIGHTEDU_DATA_DIR
        value: /var/data
      - key: INSIGHTEDU_ADMIN_USERNAME
        sync: false
      - key: INSIGHTEDU_ADMIN_PASSWORD
        sync: false
    disk:
      name: insightedu-data
      mountPath: /var/data
      sizeGB: 1
